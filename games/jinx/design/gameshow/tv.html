<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jinx — TV mockup (game-show direction)</title>
<link rel="stylesheet" href="tv.css">
<script src="tv.js" defer></script>
</head>
<body>
<div id="viewport">
  <div id="tv">
    <div class="studio">
      <div class="burst spin"><svg viewBox="-100 -100 200 200"><g class="rays"></g></svg></div>
      <div class="floor"></div>
      <div class="cone c1"></div>
      <div class="cone c2"></div>
      <div class="cone c3"></div>
    </div>
    <div id="scene"></div>
    <div id="fx"><div class="flash"></div></div>
    <div id="wipe"><div class="slab s1"></div><div class="slab s2"></div><div class="slab s3"></div><div class="slab s4"><div class="stinger"></div></div></div>
    <div id="safe" hidden></div>
  </div>
</div>
<div id="controls"></div>
</body>
</html>
