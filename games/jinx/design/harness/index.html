<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jinx TV harness</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../screen/screen.css">
<style>
  /* the TV picture fills the window; the controls (?controls=1) sit on top */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 200; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; background: rgba(13,23,22,.92); font: 13px system-ui, sans-serif; }
  #controls button { font: inherit; background: #23403d; color: #eaf6f3; border: 1px solid #3c6b66; border-radius: 5px; padding: 3px 8px; cursor: pointer; }
  #controls button.on { background: #f6b93b; color: #1d1a2b; }
  #errors { position: fixed; left: 0; top: 0; z-index: 300; max-width: 100%; background: #c00; color: #fff; font: 14px/1.3 monospace; white-space: pre-wrap; padding: 6px; }
</style>
<!-- The TV's pages import tvpipe's library from /_tvpipe/lib/: here its build in the repository (serve the repository's root). -->
<script type="importmap">{ "imports": { "/_tvpipe/lib/client.js": "../../../../npm/party/dist/client.js" } }</script>
<script type="module" src="harness.js"></script>
</head>
<body>
<div id="viewport"></div>
<div id="errors" hidden></div>
<div id="controls" hidden></div>
</body>
</html>
