<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jinx</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="host.css">
<script type="module" src="host.js"></script>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <span class="logo">Jinx</span>
      <span id="phase" class="muted"></span>
    </header>
    <section class="join">
      <div id="qr" class="qr"></div>
      <div>
        <p id="link-note" class="muted small"></p>
      </div>
    </section>
    <section>
      <h2>On the TV</h2>
      <ul id="tvs" class="tvs"><li class="muted">No TV: open the preview on a screen yourself.</li></ul>
      <div class="row">
        <button id="change-tv">Change TVs…</button>
        <button id="cast-again" hidden>Try again</button>
        <a id="player" href="#" target="_blank" hidden>Open the TV view</a>
      </div>
    </section>
    <section>
      <h2>Players <span id="count" class="muted"></span></h2>
      <ul id="players" class="players"></ul>
      <div class="row" id="bots" hidden>
        <button id="bot1">Add a bot</button>
        <button id="bot3">Add 3 bots</button>
      </div>
    </section>
    <section class="settings">
      <label>Rounds <select id="rounds"><option value="auto" selected>auto (twice up to 5 players)</option><option value="1">everyone guesses once</option><option value="2">everyone guesses twice</option></select></label>
      <label>Writing time <select id="write"><option value="30">30 s</option><option value="45" selected>45 s</option><option value="60">60 s</option><option value="90">90 s</option></select></label>
      <label>Words <select id="difficulty"><option value="easy">easy</option><option value="normal" selected>normal</option><option value="hard">hard</option></select></label>
    </section>
    <footer>
      <button id="start" class="primary">Start the game</button>
      <button id="quit" class="quiet">End</button>
    </footer>
    <p id="error" class="error" hidden></p>
  </aside>
  <main>
    <div class="preview"><iframe id="preview" title="What the TV shows"></iframe></div>
    <p class="muted small">What the TV shows (a preview, no sound). The VIP's phone can start the game too.</p>
  </main>
</div>
</body>
</html>
