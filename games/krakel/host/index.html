<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krakel</title>
<link rel="stylesheet" href="host.css">
<script type="module" src="host.js"></script>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <span class="logo">Krakel</span>
      <span id="phase" class="muted"></span>
    </header>
    <section class="join">
      <div id="qr" class="qr"></div>
      <div class="join-text">
        <p id="link-note" class="muted small"></p>
        <div class="join-link">
          <span id="join-url" class="url"></span>
          <button id="copy-link" class="act" data-t="copy">Copy</button>
        </div>
      </div>
    </section>
    <section>
      <h2 data-t="onTv">On the TV</h2>
      <ul id="tvs" class="tvs"><li class="muted" data-t="noTv">No TV: open the preview on a screen yourself.</li></ul>
      <div class="row">
        <button id="change-tv" data-t="changeTv">Change TVs…</button>
        <button id="cast-again" data-t="tryAgain" hidden>Try again</button>
        <a id="player" href="#" target="_blank" data-t="openTv" hidden>Open the TV view</a>
      </div>
    </section>
    <section>
      <h2><span data-t="players">Players</span> <span id="count" class="muted"></span></h2>
      <ul id="players" class="players"></ul>
      <div class="row" id="bots" hidden>
        <button id="bot1" data-t="addBot">Add a bot</button>
        <button id="bot3" data-t="addBots">Add 3 bots</button>
      </div>
    </section>
    <section class="settings">
      <label><span data-t="language">Language</span> <select id="lang"><option value="en" lang="en">English</option><option value="de" lang="de">Deutsch</option></select></label>
      <label><span data-t="rounds">Rounds</span> <select id="rounds"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
      <label><span data-t="drawTime">Time to draw</span> <select id="drawTime"><option value="60" data-t="min1">1 minute</option><option value="90" data-t="min1h">1½ minutes</option><option value="120" data-t="min2" selected>2 minutes</option><option value="180" data-t="min3">3 minutes</option></select></label>
      <label><span data-t="guessTime">Time to guess</span> <select id="guessTime"><option value="30" data-t="sec30">30 seconds</option><option value="45" data-t="sec45" selected>45 seconds</option><option value="60" data-t="sec60">60 seconds</option><option value="90" data-t="sec90">90 seconds</option></select></label>
      <label><span data-t="hints">Letters</span> <select id="hints"><option value="on" data-t="hintsOn" selected>shown: how many letters (easy)</option><option value="off" data-t="hintsOff">hidden (hard)</option></select></label>
      <label><span data-t="lockout">After a wrong guess</span> <select id="lockout"><option value="0" data-t="lockNone">guess on at once</option><option value="2" data-t="lock2">wait 2 seconds</option><option value="4" data-t="lock4" selected>wait 4 seconds</option><option value="8" data-t="lock8">wait 8 seconds</option></select></label>
      <label><span data-t="latecomers">Latecomers</span> <select id="late"><option value="wait" data-t="nextRound">next round</option><option value="closed" data-t="notDuring">not during a game</option></select></label>
    </section>
    <footer>
      <button id="start" class="primary">Start the game</button>
      <button id="quit" class="quiet" data-t="end">End</button>
    </footer>
    <p id="error" class="error" hidden></p>
  </aside>
  <main>
    <div class="preview"><iframe id="preview" title="What the TV shows"></iframe></div>
    <p class="muted small" data-t="previewNote">What the TV shows (a preview, no sound). The VIP's phone can start the game too.</p>
  </main>
</div>
</body>
</html>
