<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" href="{{root}}static/logo.svg" type="image/svg+xml">
<link rel="preload" href="{{root}}static/fonts/plex-sans.woff2" as="font" type="font/woff2" crossorigin>

<body class="{{kind}}">

      <rect x="23" y="137" width="419" height="331" rx="48" style="stroke:var(--logo-ink);fill:var(--logo-screen)" stroke-width="16"/>

      </g>
      <g stroke="#E8743B" stroke-width="13" transform="translate(12 0)"><path d="M492 225 C492 205 464 195 464 160 C464 136 482 120 502 120 C522 120 536 135 533 155 C531 170 518 177 507 175"/><path d="M470 290 C468 262 492 252 506 242 C520 230 524 214 518 200"/></g>

  </symbol>
</svg>

<header class="top">
  <a class="mark" href="{{root}}">
    <svg viewBox="0 0 560 520" aria-hidden="true"><use href="#logo"/></svg>
    <span>tv<b>pipe</b></span>
  </a>
  <a class="pair doc" href="{{root}}manual/">tvpipe<span>Operations Manual</span></a>
  <div class="pair crumb">{{crumb}}</div>
  <div class="right">
    <nav class="links"><a href="{{root}}manual/">Manual</a><a href="{{root}}games/">Games</a><a href="{{source}}">Source</a></nav>
    <button class="navbtn" id="navbtn" aria-expanded="false" aria-controls="nav">Contents</button>
  </div>
</header>

<div id="page">
{{body}}
</div>

<script src="{{root}}static/site.js"></script>
</body>
</html>
