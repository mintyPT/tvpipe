name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of running for hours (a run takes
    # a few minutes).
    timeout-minutes: 20
    steps:
      # .gitattributes keeps text files LF on Windows (autocrlf is on there).
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The ffmpeg oracle tests skip without ffmpeg; run them on one OS
      # (Ubuntu 24.04 ships ffmpeg 6.1 with libx264 and libopus).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # How the installers pick the release (fixtures, no network);
      # install.ps1 under pwsh, which every runner has.
      - run: sh scripts/test-installers.sh
        shell: bash
      # The library alone, with its default features (LGPL-free).
      - if: runner.os == 'Linux'
        run: cargo clippy -p tvpipe --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo test -p tvpipe

  # Every feature of the library on its own, and none (docs/rust-sdk-design.md §3).
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: One feature at a time
        run: |
          for f in "" airplay fairplay cast aac player share headless tunnel playshare files ffmpeg h264 signals; do
            echo "::group::features [$f]"
            cargo clippy -p tvpipe --no-default-features --features "$f" -- -D warnings
            echo "::endgroup::"
          done
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p tvpipe --no-deps --all-features
      # The library's own license field is LGPL-free, and so is its default
      # dependency tree, while `fairplay` really pulls the LGPL crate in.
      - name: License check
        run: |
          grep -qx 'license = "Apache-2.0"' crates/tvpipe/Cargo.toml
          ! cargo tree -p tvpipe -e normal --prefix none --format '{p} {l}' | grep LGPL
          cargo tree -p tvpipe -e normal --features fairplay --prefix none --format '{p} {l}' | grep -q LGPL

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --all-targets

  # The Node SDK (npm/tvpipe) against the debug binary.
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cargo build
      - name: Versions in lockstep (npm packages, crates)
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          for pkg in tvpipe party; do
            v="$(node -p "require('./npm/$pkg/package.json').version")"
            test "$cargo_version" = "$v" || { echo "npm/$pkg/package.json has $v, Cargo.toml $cargo_version" >&2; exit 1; }
          done
          # The crates go out in lockstep: every path dependency between
          # them names this version.
          bad="$(grep -hE '^tvpipe(-[a-z]+)? = \{ path' crates/*/Cargo.toml | grep -vE "version = \"=?$cargo_version\"" || true)"
          test -z "$bad" || { echo "path dependencies not at $cargo_version:" >&2; echo "$bad" >&2; exit 1; }
          # Every game names the tvpipe series it is made for (its
          # tvpipe.json "tvpipe"): this one. games.yml checks it again
          # before a game's release.
          series="${cargo_version%.*}"
          for manifest in games/*/tvpipe.json; do
            s="$(node -p "require('./$manifest').tvpipe || ''")"
            test "$s" = "$series" || { echo "$manifest has \"tvpipe\": \"$s\", Cargo.toml is $series" >&2; exit 1; }
          done
      - working-directory: npm/tvpipe
        run: |
          npm ci
          npm run build
          npm run check
      - working-directory: npm/tvpipe
        env:
          TVPIPE_BINARY: ${{ github.workspace }}/target/debug/tvpipe${{ runner.os == 'Windows' && '.exe' || '' }}
        run: npm test
      # The game library (npm/party; `check` also fails when the copy tvpipe
      # embeds is not what the sources build) against the debug binary
      # (playshare end to end), and the demo game on it.
      - working-directory: npm/party
        env:
          TVPIPE_BINARY: ${{ github.workspace }}/target/debug/tvpipe${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../../crates/tvpipe/src/playshare/web
          npm run check
          npm test
      # Every game, packed and checked the way games.yml releases it
      # (bash finds tvpipe.exe on Windows by this path too).
      - shell: bash
        run: |
          set -euo pipefail
          for dir in games/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            (
              cd "$dir"
              npm ci
              npm run check
              npm test
              npm run build
              ../../target/debug/tvpipe game pack . --strict -o "$RUNNER_TEMP/$name.zip"
              ../../target/debug/tvpipe game check "$RUNNER_TEMP/$name.zip" --strict
            )
            echo "::endgroup::"
          done
