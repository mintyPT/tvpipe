name: tvpipe.party

# Tests and deploys apps/tvpipe-party: the Cloudflare Worker behind
# tvpipe.party (short join links, docs/short-links.md; web rooms,
# docs/browser-party-design.md) together with the website it serves
# (site/_out): the manual, and the games in the browser, built from
# npm/party and games/* (apps/tvpipe-party/scripts/site.ts). Needs the
# repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "apps/tvpipe-party/**"
      - "site/**"
      - "npm/party/**"
      - "games/**"
      - "crates/tvpipe/src/browser/fonts/**"
      - ".github/workflows/tvpipe-party.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling.
concurrency:
  group: tvpipe-party
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tvpipe-party
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install the library
        run: npm ci
        working-directory: npm/party
      # The games' own `npm ci` runs in scripts/site.ts (each listed game
      # without node_modules), after the library is built.
      - name: Build the website and the games
        run: npm run build:web
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply tvpipe-party --remote && npx wrangler deploy
